name: Prueba del paquete de Microsoft Store

# Compila el código actual, crea el MSIX (con la identidad de prueba), lo instala en un Windows y lo comprueba desde Ajustes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Compilar
        run: npx tauri build --no-bundle -- --locked
      - name: Crear el MSIX
        shell: pwsh
        run: ./.github/scripts/crear-msix.ps1 -Exe src-tauri/target/release/vitaclip.exe -Salida "$PWD/Vitaclip.msix"
      - name: Instalar y comprobar
        shell: pwsh
        run: ./.github/scripts/prueba-msix-windows.ps1 -Msix "$PWD/Vitaclip.msix"
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capturas-msix
          path: capturas/
