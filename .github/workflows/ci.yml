name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libpipewire-0.3-dev clang libclang-dev libgbm-dev libegl-dev libxcb-randr0-dev libdbus-1-dev
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Pruebas de la interfaz
        run: |
          npm run check
          npm test
      - name: Pruebas de Rust
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings

  # El código propio de cada sistema (teclado, marcas de contraseñas, portapapeles) solo se compila en su plataforma.
  compilar-otros:
    strategy:
      fail-fast: false
      matrix:
        sistema: [windows-latest, macos-latest]
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Pruebas de Rust
        working-directory: src-tauri
        run: cargo test --locked

  # Vulnerabilidades conocidas en las dependencias (RustSec). Excepciones justificadas en src-tauri/deny.toml.
  vulnerabilidades:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories
          manifest-path: src-tauri/Cargo.toml
