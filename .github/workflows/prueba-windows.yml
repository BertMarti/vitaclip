name: Prueba del atajo en Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atajo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Compilar
        working-directory: src-tauri
        run: cargo build --locked
      - name: Pulsar el atajo como un usuario
        shell: pwsh
        run: ./.github/scripts/prueba-atajo-windows.ps1
      - name: Mover y redimensionar el popup
        if: always()
        shell: pwsh
        run: ./.github/scripts/prueba-ventana-windows.ps1
      - name: Atajo con Ñ y teclado español
        if: always()
        shell: pwsh
        run: ./.github/scripts/prueba-atajo-windows-es.ps1
      - name: Analizar los instaladores publicados con Microsoft Defender
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/defender-instaladores.ps1 -Repo "${{ github.repository }}"
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capturas-windows
          path: capturas/
