name: Publicar

on:
  push:
    tags: ["v*"]
  # A mano: rehace solo el final (latest.json, sumas y atestación) del borrador de una etiqueta ya compilada.
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta ya compilada (por ejemplo v1.0.0)"
        required: true

# Por defecto, solo lectura; cada trabajo pide lo justo. Las acciones van fijadas a un commit (no a una etiqueta movible).
permissions:
  contents: read

jobs:
  compilar:
    if: github.event_name == 'push'
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: macos-latest
            args: --target aarch64-apple-darwin -- --locked
          - plataforma: macos-latest
            args: --target x86_64-apple-darwin -- --locked
          - plataforma: ubuntu-24.04
            args: -- --locked
          - plataforma: ubuntu-24.04-arm
            args: -- --locked
          - plataforma: windows-latest
            args: -- --locked
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Dependencias del sistema (Linux)
        if: startsWith(matrix.plataforma, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libpipewire-0.3-dev clang libclang-dev libgbm-dev libegl-dev libxcb-randr0-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ startsWith(matrix.plataforma, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clave del actualizador (minisign): firma cada instalador para que la app solo instale descargas auténticas.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vitaclip ${{ github.ref_name }}"
          releaseBody: "Descarga el instalador de tu sistema más abajo. Guía de instalación: https://github.com/BertMarti/vitaclip/blob/main/docs/INSTALACION.md"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # latest.json lo genera el job `sumas` al final: si lo sube cada compilación, se pisan entre ellas.
          includeUpdaterJson: false

      # --- Firma de Windows con SignPath (solo si el repositorio tiene sus credenciales; ver docs/FIRMA.md) ---
      - name: Reunir los instaladores de Windows para firmar
        if: matrix.plataforma == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          mkdir sin-firmar
          cp src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi sin-firmar/
          ls -la sin-firmar
      - id: sin-firmar
        if: matrix.plataforma == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-sin-firmar
          path: sin-firmar/
      - name: Firmar con SignPath
        if: matrix.plataforma == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT || 'vitaclip' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION || 'initial' }}
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmados
      - name: Sustituir los instaladores del borrador por los firmados
        if: matrix.plataforma == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la firmados
          gh release upload "${{ github.ref_name }}" firmados/*.exe firmados/*.msi -R "${{ github.repository }}" --clobber
      # La firma Authenticode cambia los archivos: hay que volver a firmarlos para el actualizador (el job `sumas` genera latest.json).
      - name: Volver a firmar para el actualizador
        if: matrix.plataforma == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in firmados/*.exe firmados/*.msi; do npx tauri signer sign "$f"; done
          gh release upload "${{ github.ref_name }}" firmados/*.sig -R "${{ github.repository }}" --clobber

  # Sumas SHA-256 de todos los instaladores y atestación de procedencia (se comprueba con `gh attestation verify`).
  sumas:
    needs: compilar
    if: ${{ !cancelled() && (needs.compilar.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    env:
      ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/scripts
      - name: Descargar los instaladores del borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir artefactos
          gh release download "$ETIQUETA" -R "${{ github.repository }}" -D artefactos --skip-existing
          rm -f artefactos/SHA256SUMS.txt artefactos/latest.json
      # Con las firmas ya definitivas (también las que se rehacen tras SignPath).
      - name: Generar y subir latest.json para el actualizador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$ETIQUETA" -R "${{ github.repository }}" --json body -q .body > notas.txt
          .github/scripts/generar-latest-json.sh artefactos "$ETIQUETA" "${{ github.repository }}" "$PWD/notas.txt"
          gh release upload "$ETIQUETA" artefactos/latest.json -R "${{ github.repository }}" --clobber
      - name: Calcular y subir SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artefactos
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh release upload "$ETIQUETA" ../SHA256SUMS.txt -R "${{ github.repository }}" --clobber
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "artefactos/*"
