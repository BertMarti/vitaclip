[package]
name = "vitaclip"
version = "0.3.2"
description = "El portapapeles supervitaminado"
authors = ["BertMarti"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "vitaclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# Solo por ResizeDirection (tauri no la reexporta); misma versión que ya usa tauri.
tauri-runtime = "2"
auto-launch = "0.6"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
enigo = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
regex = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
xcap = "0.9.8"
openh264 = "0.9"
muxide = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }

# Para leer las marcas «no guardar» de los gestores de contraseñas (sensible.rs); mismas versiones que ya usa arboard.
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
